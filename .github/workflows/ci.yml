name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Vérifier les messages de commit
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Vérifier le formatage
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Tests
        run: pnpm test

      - name: Storybook (build statique)
        run: pnpm --filter @onec/components build-storybook

      - name: Installer Chromium pour Playwright
        run: pnpm --filter @onec/components exec playwright install --with-deps chromium

      - name: Tests navigateur (interactions, axe, captures)
        run: pnpm --filter @onec/components e2e

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            packages/components/playwright-report
            packages/components/test-results
          retention-days: 7
